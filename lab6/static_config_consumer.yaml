components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 2
  default_task_processor: main-task-processor

  components:
    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info

    server:
      listener:
        port: 8080
        task_processor: main-task-processor
      listener-monitor:
        port: 8081
        task_processor: main-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    testsuite-support:
      testsuite-tasks-enabled: false

    default-secdist-provider:
      config: /service/secure_data.json
      missing-ok: false
      environment-secrets-key: SECDIST_CONFIG

    secdist: {}

    dynamic-config:
      defaults:
        POSTGRES_CONNECTION_POOL_SETTINGS:
          postgres-db:
            min_pool_size: 2
            max_pool_size: 8
            max_queue_size: 200
        POSTGRES_STATEMENT_METRICS_SETTINGS:
          postgres-db:
            max_statement_metrics: 30

    postgres-db:
      dbconnection: postgresql://hotel_user:hotel_password@db:5432/hotel_booking
      blocking_task_processor: fs-task-processor
      dns_resolver: getaddrinfo

    rabbit-events:
      secdist_alias: rabbit-events
      min_pool_size: 2
      max_pool_size: 6
      max_in_flight_requests: 10
      heartbeat_interval_seconds: 30
      use_secure_connection: false

    rabbit-topology: {}

    consumer-audit-events:
      rabbit_name: rabbit-events
      queue: hotel.events.audit
      prefetch_count: 10
